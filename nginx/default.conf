server {
    listen 80;
    server_name localhost;

    # Frontend Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API Gateway / Backend Services Routing
    location /api/ {
        # Assuming we bypass the gateway and route directly, or use a gateway?
        # The user said "bỏ qua admin-service, gateway-service khỏi pom.xml", so no gateway!
        # If there is no gateway, Nginx MUST route to individual services!
        
        # We need to map routes to services here. E.g.:
        # /api/auth -> http://auth-service:8081
        # /api/user -> http://user-service:8082
        # /api/test -> http://test-service:8088
        # /api/classroom -> http://classroom-service:8085
        # /api/lesson -> http://lesson-service:8086
        # /api/textbook -> http://textbook-service:8089
        
        # Let's route based on path prefixes:
        location /api/auth/ {
            proxy_pass http://auth-service:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/user/ {
            proxy_pass http://user-service:8082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/test/ {
            proxy_pass http://test-service:8088/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/classroom/ {
            proxy_pass http://classroom-service:8085/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/lesson/ {
            proxy_pass http://lesson-service:8086/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/textbook/ {
            proxy_pass http://textbook-service:8089/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # If it doesn't match above, it will return 404.
    }

    # Specific routes mentioned in .env.local:
    # VITE_TTS_API_URL=http://35.247.128.131/api/tts
    location /api/tts/ {
        proxy_pass http://tts-service:8084/;
        proxy_set_header Host $host;
    }

    # VITE_PRONUNCIATION_API_URL=http://35.247.128.131/api/pronunciation
    location /api/pronunciation/ {
        proxy_pass http://speech-recognition-service:8087/;
        proxy_set_header Host $host;
    }

    # VITE_TRANSLATE_API_URL=http://35.247.128.131/api/translate
    location /api/translate/ {
        proxy_pass http://translate-service:8090/;
        proxy_set_header Host $host;
    }

    # VITE_IMAGE_API_URL=http://35.247.128.131/image-api
    location /image-api/ {
        proxy_pass http://image-service:8083/;
        proxy_set_header Host $host;
    }

    # VITE_CANVAS_API_URL=http://35.247.128.131/python-api
    location /python-api/ {
        proxy_pass http://python-api:8001/;
        proxy_set_header Host $host;
    }
}
