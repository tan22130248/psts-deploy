server {
    listen 80;
    server_name 35.247.128.131;

    client_max_body_size 100M;

    # ── Frontend Static Files ──
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # ══════════════════════════════════════════
    # Backend API routing (no gateway — Nginx acts as reverse proxy)
    # ══════════════════════════════════════════

    # Auth Service (port 8081, no context-path)
    location /api/auth/ {
        proxy_pass http://auth-service:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google OAuth2 redirect callback → auth-service
    location /login/oauth2/code/google {
        proxy_pass http://auth-service:8081/login/oauth2/code/google;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User Service (port 8082, no context-path)
    location /api/user/ {
        proxy_pass http://user-service:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Classroom Service (port 8085, no context-path)
    location /api/classroom/ {
        proxy_pass http://classroom-service:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Test Service (port 8088, no context-path)
    location /api/test/ {
        proxy_pass http://test-service:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lesson Service (port 8087, no context-path)
    location /api/lesson/ {
        proxy_pass http://lesson-service:8087/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Textbook Service (port 8090, no context-path)
    location /api/textbook/ {
        proxy_pass http://textbook-service:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── TTS Service (port 8084, context-path: /api/tts) ──
    # Service already has context-path /api/tts, so pass through as-is
    location /api/tts/ {
        proxy_pass http://tts-service:8084/api/tts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Speech Recognition Service (port 8086, context-path: /api/pronunciation) ──
    location /api/pronunciation/ {
        proxy_pass http://speech-recognition-service:8086/api/pronunciation/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Translate Service (port 8089, context-path: /api/translate) ──
    location /api/translate/ {
        proxy_pass http://translate-service:8089/api/translate/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Image Service (port 8083, no context-path) ──
    location /image-api/ {
        proxy_pass http://image-service:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Python API (port 8001) ──
    location /python-api/ {
        proxy_pass http://python-api:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Error pages ──
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
