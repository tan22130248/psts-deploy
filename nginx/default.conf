# VPS production nginx — Cloudflare Origin SSL + Docker DNS variables
# QUAN TRỌNG: với `set $upstream_...` thì proxy_pass KHÔNG được kèm URI path
# (trừ location exact). Kèm path + variable dễ 502 hoặc strip path → OAuth2 302.

# HTTP → HTTPS
server {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    listen 80;
    server_name teachprimary.dev www.teachprimary.dev;
    return 301 https://$host$request_uri;
}

server {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    listen 443 ssl;
    server_name teachprimary.dev www.teachprimary.dev;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Login exact — full path tới controller
    location = /api/auth/login {
        set $upstream_user_service user-service;
        proxy_pass http://$upstream_user_service:8082/api/auth/login$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Content-Type $http_content_type;
    }

    # Auth còn lại — KHÔNG URI suffix (giữ nguyên /api/auth/...)
    location /api/auth/ {
        set $upstream_user_service user-service;
        proxy_pass http://$upstream_user_service:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA OAuth callback (React)
    location = /oauth2/callback {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /oauth2/ {
        set $upstream_user_service user-service;
        proxy_pass http://$upstream_user_service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /login/oauth2/ {
        set $upstream_user_service user-service;
        proxy_pass http://$upstream_user_service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/user/ {
        set $upstream_user_service user-service;
        proxy_pass http://$upstream_user_service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/action-logs/ {
        set $upstream_user_service user-service;
        proxy_pass http://$upstream_user_service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ^~ so /api/admin/classrooms* always hits classroom-service (not user-service /api/admin/)
    location ^~ /api/admin/classrooms {
        set $upstream_classroom_service classroom-service;
        proxy_pass http://$upstream_classroom_service:8085;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    location /api/admin/ {
        set $upstream_user_service user-service;
        proxy_pass http://$upstream_user_service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/classrooms/ {
        set $upstream_classroom_service classroom-service;
        proxy_pass http://$upstream_classroom_service:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/student/ {
        set $upstream_classroom_service classroom-service;
        proxy_pass http://$upstream_classroom_service:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/tests/ {
        set $upstream_test_service test-service;
        proxy_pass http://$upstream_test_service:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100M;
    }

    location /api/questions/ {
        set $upstream_test_service test-service;
        proxy_pass http://$upstream_test_service:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100M;
    }

    location /api/lessons/ {
        set $upstream_lesson_service lesson-service;
        proxy_pass http://$upstream_lesson_service:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 50M;
    }

    location /wopi/ {
        set $upstream_lesson_service lesson-service;
        proxy_pass http://$upstream_lesson_service:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/textbooks {
        set $upstream_textbook_service textbook-service;
        proxy_pass http://$upstream_textbook_service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/tts/ {
        set $upstream_tts_service tts-service;
        proxy_pass http://$upstream_tts_service:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100M;
        proxy_read_timeout 60s;
    }

    location /api/pronunciation/ {
        set $upstream_speech_recognition_service speech-recognition-service;
        proxy_pass http://$upstream_speech_recognition_service:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100M;
        proxy_read_timeout 60s;
    }

    location /api/translate/ {
        set $upstream_translate_service translate-service;
        proxy_pass http://$upstream_translate_service:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }

    location /image-api/ {
        set $upstream_image_service image-service;
        proxy_pass http://$upstream_image_service:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100M;
    }

    location /python-api/ {
        set $upstream_python_api python-api;
        proxy_pass http://$upstream_python_api:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 100M;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
