version: '3.8'

services:
  # ==============================================================================
  # Database Service
  # ==============================================================================
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - psts-network

  # ==============================================================================
  # Service Discovery
  # ==============================================================================
  eureka-server:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: eureka_server
    container_name: eureka-server
    restart: always
    ports:
      - "8761:8761"
    networks:
      - psts-network

  # ==============================================================================
  # API Gateway
  # ==============================================================================
  api-gateway:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      - EUREKA_DEFAULT_ZONE=${EUREKA_DEFAULT_ZONE}
      - TEST_SERVICE_URL=${TEST_SERVICE_URL}
      - PYTHON_CANVAS_API_URL=${PYTHON_CANVAS_API_URL}
    depends_on:
      - eureka-server
    networks:
      - psts-network

  # ==============================================================================
  # Spring Boot Microservices
  # ==============================================================================
  auth-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: auth-service
    restart: always
    environment:
      - EUREKA_DEFAULT_ZONE=${EUREKA_DEFAULT_ZONE}
      - SPRING_DATASOURCE_URL=${AUTH_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mysql
      - eureka-server
    networks:
      - psts-network

  user-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: user-service
    restart: always
    environment:
      - EUREKA_DEFAULT_ZONE=${EUREKA_DEFAULT_ZONE}
      - SPRING_DATASOURCE_URL=${USER_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mysql
      - eureka-server
    networks:
      - psts-network

  image-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: image-service
    container_name: image-service
    restart: always
    environment:
      - EUREKA_DEFAULT_ZONE=${EUREKA_DEFAULT_ZONE}
      - IMAGE_DB_URL=${IMAGE_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - PYTHON_API_URL=${PYTHON_API_URL}
    depends_on:
      - mysql
      - eureka-server
    networks:
      - psts-network

  tts-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: tts-service
    container_name: tts-service
    restart: always
    environment:
      - EUREKA_DEFAULT_ZONE=${EUREKA_DEFAULT_ZONE}
      - TTS_DB_URL=${TTS_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - PYTHON_API_URL=${PYTHON_API_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mysql
      - eureka-server
    networks:
      - psts-network

  speech-recognition-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: speech-recognition-service
    container_name: speech-recognition-service
    restart: always
    environment:
      - EUREKA_DEFAULT_ZONE=${EUREKA_DEFAULT_ZONE}
      - PYTHON_API_URL=${PYTHON_API_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - eureka-server
    networks:
      - psts-network

  classroom-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: classroom-service
    container_name: classroom-service
    restart: always
    environment:
      - EUREKA_DEFAULT_ZONE=${EUREKA_DEFAULT_ZONE}
      - SPRING_DATASOURCE_URL=${CLASSROOM_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET}
    depends_on:
      - mysql
      - eureka-server
    networks:
      - psts-network

  test-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: test-service
    container_name: test-service
    restart: always
    environment:
      - EUREKA_DEFAULT_ZONE=${EUREKA_DEFAULT_ZONE}
      - TEST_DB_URL=${TEST_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - PYTHON_API_URL=${PYTHON_API_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - mysql
      - eureka-server
    networks:
      - psts-network

  lesson-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: lesson-service
    container_name: lesson-service
    restart: always
    environment:
      - EUREKA_DEFAULT_ZONE=${EUREKA_DEFAULT_ZONE}
      - SPRING_DATASOURCE_URL=${LESSON_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET}
    depends_on:
      - mysql
      - eureka-server
    networks:
      - psts-network

  textbook-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: textbook-service
    container_name: textbook-service
    restart: always
    environment:
      - EUREKA_DEFAULT_ZONE=${EUREKA_DEFAULT_ZONE}
      - SPRING_DATASOURCE_URL=${TEXTBOOK_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mysql
      - eureka-server
    networks:
      - psts-network

  translate-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: translate-service
    container_name: translate-service
    restart: always
    environment:
      - EUREKA_DEFAULT_ZONE=${EUREKA_DEFAULT_ZONE}
      - PYTHON_API_URL=${PYTHON_API_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - eureka-server
    networks:
      - psts-network

  # ==============================================================================
  # Python FastAPI Service
  # ==============================================================================
  python-api:
    build:
      context: ../api-python
      dockerfile: Dockerfile
    container_name: python-api
    restart: always
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    networks:
      - psts-network

  # ==============================================================================
  # Frontend React App (built and served by internal Nginx)
  # ==============================================================================
  frontend:
    build:
      context: ../PrimarySchoolTeacherSupportSystemFrontEnd
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    networks:
      - psts-network

  # ==============================================================================
  # Global Nginx Reverse Proxy (Gateway for external traffic)
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - api-gateway
      - python-api
    networks:
      - psts-network

networks:
  psts-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
