services:
  # ──────────────────────────────────────────────
  # 1. MySQL Database
  # ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: psts-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    networks:
      - psts-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────
  # 2. Eureka Server
  # ──────────────────────────────────────────────
  eureka-server:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: eureka_server
    container_name: psts-eureka
    restart: always
    ports:
      - "8761:8761"
    networks:
      - psts-network
    healthcheck:
      # JRE image không có curl/actuator — chỉ kiểm tra port 8761 mở
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # ──────────────────────────────────────────────
  # 3. Auth Service (port 8081)
  # ──────────────────────────────────────────────
  auth-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: psts-auth
    restart: always
    environment:
      # Database — uses AUTH_DB_* variables
      - AUTH_DB_URL=jdbc:mysql://mysql:3306/edu?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - AUTH_DB_USERNAME=root
      - AUTH_DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # Eureka
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=auth-service
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=86400000
      # Google OAuth2
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # OAuth callback public URL (Nginx → user-service). auth-service OTP hiện là stub.
      - AUTH_GOOGLE_REDIRECT_URI=https://teachprimary.dev/login/oauth2/code/google
      # Mail
      - AUTH_MAIL_HOST=smtp.gmail.com
      - AUTH_MAIL_PORT=587
      - AUTH_MAIL_USERNAME=${MAIL_USERNAME}
      - AUTH_MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - psts-network

  # ──────────────────────────────────────────────
  # 4. User Service (port 8082)
  # ──────────────────────────────────────────────
  user-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: psts-user
    restart: always
    environment:
      # Database — uses USER_DB_* variables
      - USER_DB_URL=jdbc:mysql://mysql:3306/edu?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - USER_DB_USERNAME=root
      - USER_DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # Eureka
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=user-service
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=86400000
      # Google OAuth2
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - USER_GOOGLE_REDIRECT_URI=https://teachprimary.dev/login/oauth2/code/google
      - APP_FRONTEND_URL=https://teachprimary.dev
      # Mail
      - USER_MAIL_HOST=smtp.gmail.com
      - USER_MAIL_PORT=587
      - USER_MAIL_USERNAME=${MAIL_USERNAME}
      - USER_MAIL_PASSWORD=${MAIL_PASSWORD}
      - APP_MAIL_TEST_MODE=false
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - psts-network

  # ──────────────────────────────────────────────
  # 5. Classroom Service (port 8085)
  # ──────────────────────────────────────────────
  classroom-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: classroom-service
    container_name: psts-classroom
    restart: always
    environment:
      # Database — uses CLASSROOM_DB_* variables
      - CLASSROOM_DB_URL=jdbc:mysql://mysql:3306/classroom_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - CLASSROOM_DB_USERNAME=root
      - CLASSROOM_DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # Eureka
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=classroom-service
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=86400000
      # Mail
      - CLASSROOM_MAIL_HOST=smtp.gmail.com
      - CLASSROOM_MAIL_PORT=587
      - CLASSROOM_MAIL_USERNAME=${MAIL_USERNAME}
      - CLASSROOM_MAIL_PASSWORD=${MAIL_PASSWORD}
      # Frontend URL (for invite links etc.)
      - CLASSROOM_FRONTEND_BASE_URL=https://teachprimary.dev
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - psts-network

  # ──────────────────────────────────────────────
  # 6. Test Service (port 8088)
  # ──────────────────────────────────────────────
  test-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: test-service
    container_name: psts-test
    restart: always
    environment:
      # Database — test-service uses TEST_DB_* variables (hardcoded in yml)
      - TEST_DB_URL=jdbc:mysql://mysql:3306/test_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # Eureka
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=test-service
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=86400000
      # Cloudinary
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # Python API
      - python.api.url=http://python-api:8001
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - psts-network

  # ──────────────────────────────────────────────
  # 7. Image Service (port 8083)
  # ──────────────────────────────────────────────
  image-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: image-service
    container_name: psts-image
    restart: always
    environment:
      # Database — image-service uses IMAGE_DB_* variables (hardcoded in properties)
      - IMAGE_DB_URL=jdbc:mysql://mysql:3306/image_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # Eureka
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=image-service
      # Cloudinary — image-service uses cloudinary.* prefix (hardcoded in properties)
      - cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
      - cloudinary.api-key=${CLOUDINARY_API_KEY}
      - cloudinary.api-secret=${CLOUDINARY_API_SECRET}
      # Python API
      - python.image.api-url=http://python-api:8001
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - psts-network

  # ──────────────────────────────────────────────
  # 8. Textbook Service (port 8090)
  # ──────────────────────────────────────────────
  textbook-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: textbook-service
    container_name: psts-textbook
    restart: always
    environment:
      # Database — uses TEXTBOOK_DB_* variables
      - TEXTBOOK_DB_URL=jdbc:mysql://mysql:3306/textbook_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - TEXTBOOK_DB_USERNAME=root
      - TEXTBOOK_DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # Eureka
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=textbook-service
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - psts-network

  # ──────────────────────────────────────────────
  # 9. Lesson Service (port 8087)
  # ──────────────────────────────────────────────
  lesson-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: lesson-service
    container_name: psts-lesson
    restart: always
    environment:
      # Database — uses LESSON_DB_* variables
      - LESSON_DB_URL=jdbc:mysql://mysql:3306/lesson_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - LESSON_DB_USERNAME=root
      - LESSON_DB_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # Eureka
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=lesson-service
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=86400000
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET}
      # Python API
      - PYTHON_API_URL=http://python-api:8001
      # Collabora Online (CODE) — discovery must reach collabora container
      - COLLABORA_DISCOVERY_URL=${COLLABORA_DISCOVERY_URL:-http://collabora:9980/hosting/discovery}
      - COLLABORA_PUBLIC_URL=${COLLABORA_PUBLIC_URL:-https://teachprimary.dev}
      - COLLABORA_WOPI_PUBLIC_URL=${COLLABORA_WOPI_PUBLIC_URL:-https://teachprimary.dev/wopi/files}
      - COLLABORA_ASSET_PUBLIC_URL=${COLLABORA_ASSET_PUBLIC_URL:-https://teachprimary.dev/api/lessons/drafts/collabora/assets}
      - COLLABORA_POST_MESSAGE_ORIGIN=${COLLABORA_POST_MESSAGE_ORIGIN:-https://teachprimary.dev}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      collabora:
        condition: service_started
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - psts-network

  # ──────────────────────────────────────────────
  # 9b. Collabora Online (CODE) — port 9980 internal
  # ──────────────────────────────────────────────
  collabora:
    image: collabora/code:24.04.12.3.1
    container_name: psts-collabora
    restart: always
    environment:
      # Escape dots for Collabora domain regex
      - domain=teachprimary\\.dev|www\\.teachprimary\\.dev
      - aliasgroup1=https://teachprimary.dev:443,https://www.teachprimary.dev:443
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:net.frame_ancestors=https://teachprimary.dev https://www.teachprimary.dev
      - username=${COLLABORA_ADMIN_USER:-admin}
      - password=${COLLABORA_ADMIN_PASSWORD:-collabora}
      - DONT_GEN_SSL_CERT=true
    cap_add:
      - MKNOD
    networks:
      - psts-network

  # ──────────────────────────────────────────────
  # 10. TTS Service (port 8084)
  # ──────────────────────────────────────────────
  tts-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: tts-service
    container_name: psts-tts
    restart: always
    environment:
      # Database — uses TTS_DB_URL + SPRING_DATASOURCE_USERNAME/PASSWORD
      - TTS_DB_URL=jdbc:mysql://mysql:3306/tts_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # Eureka
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=tts-service
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      # Cloudinary
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # Python API
      - PYTHON_API_URL=http://python-api:8001/api
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - psts-network

  # ──────────────────────────────────────────────
  # 11. Translate Service (port 8089)
  # ──────────────────────────────────────────────
  translate-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: translate-service
    container_name: psts-translate
    restart: always
    environment:
      # Eureka
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=translate-service
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      # Python API
      - PYTHON_API_URL=http://python-api:8001
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - psts-network

  # ──────────────────────────────────────────────
  # 12. Speech Recognition Service (port 8086)
  # ──────────────────────────────────────────────
  speech-recognition-service:
    build:
      context: ../PrimarySchoolTeacherSupportSystemBackend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: speech-recognition-service
    container_name: psts-speech
    restart: always
    environment:
      # Eureka
      - EUREKA_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - eureka.instance.prefer-ip-address=true
      - eureka.instance.hostname=speech-recognition-service
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      # Python API
      - PYTHON_API_URL=http://python-api:8001
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - psts-network

  # ──────────────────────────────────────────────
  # 13. Python API (port 8001)
  # ──────────────────────────────────────────────
  python-api:
    build:
      context: ../api-python
      dockerfile: Dockerfile
    container_name: psts-python-api
    restart: always
    environment:
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - HOST=0.0.0.0
      - PORT=8001
      - DEBUG=False
    networks:
      - psts-network

  # ──────────────────────────────────────────────
  # 14. Frontend (Nginx reverse proxy + static)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ../PrimarySchoolTeacherSupportSystemFrontEnd
      dockerfile: Dockerfile
    container_name: psts-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Cloudflare Origin certs on VM host (created once under /etc/ssl/cloudflare/)
      - /etc/ssl/cloudflare/cert.pem:/etc/ssl/cloudflare/cert.pem:ro
      - /etc/ssl/cloudflare/key.pem:/etc/ssl/cloudflare/key.pem:ro
    depends_on:
      - auth-service
      - user-service
      - test-service
      - python-api
      - lesson-service
      - collabora
    networks:
      - psts-network

volumes:
  mysql-data:

networks:
  psts-network:
    driver: bridge
